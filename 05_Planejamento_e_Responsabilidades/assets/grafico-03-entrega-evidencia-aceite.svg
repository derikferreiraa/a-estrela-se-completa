<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="615" viewBox="0 0 1580 615"><rect width="100%" height="100%" rx="18" fill="#f6f6f3"/><text x="56" y="68" fill="#151719" font-family="Inter,DejaVu Sans,sans-serif" font-size="35" font-weight="750" text-anchor="start">NÃO É SÓ CUMPRIR PRAZO. É REGISTRAR O ACEITE.</text><text x="56" y="110" fill="#626973" font-family="Inter,DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">O avanço depende de entregas identificáveis, evidência e decisão da área competente.</text><rect x="56" y="165" width="350" height="219" rx="12" fill="#ffffff" stroke="#dcdfe3" stroke-width="1.5"/><rect x="79" y="188" width="50" height="50" rx="25" fill="#151719" stroke="none" stroke-width="0"/><text x="104" y="221" fill="#ffffff" font-family="Inter,DejaVu Sans,sans-serif" font-size="21" font-weight="760" text-anchor="middle">01</text><text x="80" y="277" fill="#b78d42" font-family="Inter,DejaVu Sans,sans-serif" font-size="23" font-weight="770" text-anchor="start">ENTREGA</text><text x="80" y="316" fill="#151719" font-family="Inter,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">O fornecedor ou a área</text><text x="80" y="345" fill="#626973" font-family="Inter,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">apresenta o material.</text><text x="431" y="299" fill="#b78d42" font-family="Inter,DejaVu Sans,sans-serif" font-size="38" font-weight="760" text-anchor="middle">›</text><rect x="436" y="165" width="350" height="219" rx="12" fill="#ffffff" stroke="#dcdfe3" stroke-width="1.5"/><rect x="459" y="188" width="50" height="50" rx="25" fill="#151719" stroke="none" stroke-width="0"/><text x="484" y="221" fill="#ffffff" font-family="Inter,DejaVu Sans,sans-serif" font-size="21" font-weight="760" text-anchor="middle">02</text><text x="460" y="277" fill="#b78d42" font-family="Inter,DejaVu Sans,sans-serif" font-size="23" font-weight="770" text-anchor="start">EVIDÊNCIA</text><text x="460" y="316" fill="#151719" font-family="Inter,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Teste, registro, planta,</text><text x="460" y="345" fill="#626973" font-family="Inter,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">cotação ou relatório.</text><text x="811" y="299" fill="#b78d42" font-family="Inter,DejaVu Sans,sans-serif" font-size="38" font-weight="760" text-anchor="middle">›</text><rect x="816" y="165" width="350" height="219" rx="12" fill="#ffffff" stroke="#dcdfe3" stroke-width="1.5"/><rect x="839" y="188" width="50" height="50" rx="25" fill="#151719" stroke="none" stroke-width="0"/><text x="864" y="221" fill="#ffffff" font-family="Inter,DejaVu Sans,sans-serif" font-size="21" font-weight="760" text-anchor="middle">03</text><text x="840" y="277" fill="#b78d42" font-family="Inter,DejaVu Sans,sans-serif" font-size="23" font-weight="770" text-anchor="start">VALIDAÇÃO</text><text x="840" y="316" fill="#151719" font-family="Inter,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">A área competente</text><text x="840" y="345" fill="#626973" font-family="Inter,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">aprova ou devolve.</text><text x="1191" y="299" fill="#b78d42" font-family="Inter,DejaVu Sans,sans-serif" font-size="38" font-weight="760" text-anchor="middle">›</text><rect x="1196" y="165" width="350" height="219" rx="12" fill="#ffffff" stroke="#dcdfe3" stroke-width="1.5"/><rect x="1219" y="188" width="50" height="50" rx="25" fill="#151719" stroke="none" stroke-width="0"/><text x="1244" y="221" fill="#ffffff" font-family="Inter,DejaVu Sans,sans-serif" font-size="21" font-weight="760" text-anchor="middle">04</text><text x="1220" y="277" fill="#b78d42" font-family="Inter,DejaVu Sans,sans-serif" font-size="23" font-weight="770" text-anchor="start">DECISÃO</text><text x="1220" y="316" fill="#151719" font-family="Inter,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Liberar, corrigir ou</text><text x="1220" y="345" fill="#626973" font-family="Inter,DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">acionar alternativa.</text><rect x="55" y="415" width="1470" height="135" rx="12" fill="#151719" stroke="none" stroke-width="0"/><text x="87" y="459" fill="#f0cf8e" font-family="Inter,DejaVu Sans,sans-serif" font-size="23" font-weight="750" text-anchor="start">CRITÉRIO DE ABERTURA</text><text x="87" y="496" fill="#ffffff" font-family="Inter,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Sem aceite de Operações para o espaço e sem solução cenográfica segura,</text><text x="87" y="524" fill="#ffffff" font-family="Inter,DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">a colagem não abre. A continuidade depende de uma alternativa previamente aprovada.</text><text x="56" y="588" fill="#626973" font-family="Inter,DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Os horários do plano de contingência pertencem ao Slide 8 e precisam ser compatíveis com a abertura real dos portões.</text></svg>