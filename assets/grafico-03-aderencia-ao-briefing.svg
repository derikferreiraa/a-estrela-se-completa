<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540"><rect width="1280" height="540" fill="#f6f7f8" rx="22"/><text x="45" y="58" fill="#24292f" font-family="DejaVu Sans" font-size="26" font-weight="700">O CONCEITO NÃO É UM ENFEITE: ELE RESPONDE AO BRIEFING.</text><text x="45" y="88" fill="#687584" font-family="DejaVu Sans" font-size="16">Cada promessa na capa tem uma expressão concreta na proposta e uma evidência em outro slide.</text><text x="45" y="145" fill="#816022" font-family="DejaVu Sans" font-size="16" font-weight="700">O QUE O DESAFIO PEDE</text><text x="425" y="145" fill="#816022" font-family="DejaVu Sans" font-size="16" font-weight="700">A RESPOSTA DA IDEIA</text><text x="852" y="145" fill="#816022" font-family="DejaVu Sans" font-size="16" font-weight="700">ONDE É DETALHADO</text><rect x="42" y="162" width="1188" height="57" rx="8" fill="#fff" stroke="#d9dfe5" stroke-width="1.5"/><text x="57" y="197" fill="#1c1e21" font-family="DejaVu Sans" font-size="15" font-weight="700">Conexão com a torcida</text><text x="440" y="197" fill="#4f5b69" font-family="DejaVu Sans" font-size="14">Uma lembrança + um gesto</text><rect x="854" y="173" width="338" height="35" rx="8" fill="#f2e6d0" stroke="#f2e6d0" stroke-width="1.5"/><text x="870" y="196" fill="#6b4c1f" font-family="DejaVu Sans" font-size="14" font-weight="700">Slides 3 e 7</text><rect x="42" y="227" width="1188" height="57" rx="8" fill="#fbf8f2" stroke="#d9dfe5" stroke-width="1.5"/><text x="57" y="262" fill="#1c1e21" font-family="DejaVu Sans" font-size="15" font-weight="700">História e identidade</text><text x="440" y="262" fill="#4f5b69" font-family="DejaVu Sans" font-size="14">Estrela Solitária como símbolo</text><rect x="854" y="238" width="338" height="35" rx="8" fill="#f2e6d0" stroke="#f2e6d0" stroke-width="1.5"/><text x="870" y="261" fill="#6b4c1f" font-family="DejaVu Sans" font-size="14" font-weight="700">Slide 2</text><rect x="42" y="292" width="1188" height="57" rx="8" fill="#fff" stroke="#d9dfe5" stroke-width="1.5"/><text x="57" y="327" fill="#1c1e21" font-family="DejaVu Sans" font-size="15" font-weight="700">Experiência em matchday</text><text x="440" y="327" fill="#4f5b69" font-family="DejaVu Sans" font-size="14">Ritual voluntário no estádio</text><rect x="854" y="303" width="338" height="35" rx="8" fill="#f2e6d0" stroke="#f2e6d0" stroke-width="1.5"/><text x="870" y="326" fill="#6b4c1f" font-family="DejaVu Sans" font-size="14" font-weight="700">Slides 3 e 4</text><rect x="42" y="357" width="1188" height="57" rx="8" fill="#fbf8f2" stroke="#d9dfe5" stroke-width="1.5"/><text x="57" y="392" fill="#1c1e21" font-family="DejaVu Sans" font-size="15" font-weight="700">Integração das áreas</text><text x="440" y="392" fill="#4f5b69" font-family="DejaVu Sans" font-size="14">Branding articula a execução</text><rect x="854" y="368" width="338" height="35" rx="8" fill="#f2e6d0" stroke="#f2e6d0" stroke-width="1.5"/><text x="870" y="391" fill="#6b4c1f" font-family="DejaVu Sans" font-size="14" font-weight="700">Slide 5</text><rect x="42" y="422" width="1188" height="57" rx="8" fill="#fff" stroke="#d9dfe5" stroke-width="1.5"/><text x="57" y="457" fill="#1c1e21" font-family="DejaVu Sans" font-size="15" font-weight="700">Viabilidade e crise</text><text x="440" y="457" fill="#4f5b69" font-family="DejaVu Sans" font-size="14">Orçamento e planos alternativos</text><rect x="854" y="433" width="338" height="35" rx="8" fill="#f2e6d0" stroke="#f2e6d0" stroke-width="1.5"/><text x="870" y="456" fill="#6b4c1f" font-family="DejaVu Sans" font-size="14" font-weight="700">Slides 6 e 8</text><text x="46" y="520" fill="#687584" font-family="DejaVu Sans" font-size="13">A capa apresenta a promessa. Os demais slides demonstram como ela pode ser executada e validada.</text></svg>