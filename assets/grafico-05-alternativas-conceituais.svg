<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="518" viewBox="0 0 1280 518"><rect width="1280" height="518" fill="#f6f7f8" rx="22"/><text x="42" y="59" fill="#24292f" font-family="DejaVu Sans" font-size="27" font-weight="700">TRÊS CAMINHOS DISCUTIDOS. UMA DECISÃO DE PROJETO.</text><text x="42" y="89" fill="#687584" font-family="DejaVu Sans" font-size="16">Comparação qualitativa: identidade, participação, operação e aderência ao desafio.</text><rect x="40" y="140" width="393" height="313" rx="14" fill="#fff" stroke="#d9dfe5" stroke-width="1.5"/><text x="63" y="180" fill="#c9a157" font-family="DejaVu Sans" font-size="26" font-weight="700">01</text><text x="63" y="227" fill="#1c1e21" font-family="DejaVu Sans" font-size="21" font-weight="700">A VOZ DE QUEM</text><text x="63" y="255" fill="#1c1e21" font-family="DejaVu Sans" font-size="21" font-weight="700">NUNCA CALA</text><text x="63" y="323" fill="#687584" font-family="DejaVu Sans" font-size="14">Memória oral e expressão coletiva</text><text x="63" y="376" fill="#83622e" font-family="DejaVu Sans" font-size="14" font-weight="700">Desafio: captação e edição</text><rect x="457" y="140" width="393" height="313" rx="14" fill="#fff" stroke="#d9dfe5" stroke-width="1.5"/><text x="480" y="180" fill="#c9a157" font-family="DejaVu Sans" font-size="26" font-weight="700">02</text><text x="480" y="227" fill="#1c1e21" font-family="DejaVu Sans" font-size="21" font-weight="700">MEU PRIMEIRO</text><text x="480" y="255" fill="#1c1e21" font-family="DejaVu Sans" font-size="21" font-weight="700">NILTÃO</text><text x="480" y="323" fill="#687584" font-family="DejaVu Sans" font-size="14">Acolhimento da primeira visita</text><text x="480" y="376" fill="#83622e" font-family="DejaVu Sans" font-size="14" font-weight="700">Limite: público mais específico</text><rect x="874" y="140" width="393" height="313" rx="14" fill="#1c1e21" stroke="#c9a157" stroke-width="1.5"/><text x="897" y="180" fill="#c9a157" font-family="DejaVu Sans" font-size="26" font-weight="700">03</text><text x="897" y="227" fill="#fff" font-family="DejaVu Sans" font-size="21" font-weight="700">A ESTRELA</text><text x="897" y="255" fill="#fff" font-family="DejaVu Sans" font-size="21" font-weight="700">SE COMPLETA</text><text x="897" y="323" fill="#e1e4e8" font-family="DejaVu Sans" font-size="14">Memória física + gesto coletivo</text><text x="897" y="376" fill="#c9a157" font-family="DejaVu Sans" font-size="14" font-weight="700">Selecionada para desenvolvimento</text><text x="44" y="488" fill="#687584" font-family="DejaVu Sans" font-size="14">A seleção é fundamentada por critérios, não por uma nota apresentada sem pesos ou método auditável.</text></svg>