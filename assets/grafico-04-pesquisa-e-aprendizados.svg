<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="515" viewBox="0 0 1280 515"><rect width="1280" height="515" fill="#f6f7f8" rx="22"/><text x="40" y="56" fill="#24292f" font-family="DejaVu Sans" font-size="27" font-weight="700">PESQUISAR MECANISMOS, NÃO COPIAR FORMATOS.</text><text x="40" y="89" fill="#687584" font-family="DejaVu Sans" font-size="16">Quatro referências consultadas; cada uma ajudou a avaliar participação, contexto e execução.</text><rect x="35" y="139" width="294" height="298" rx="12" fill="#1c1e21" stroke="#c9a157" stroke-width="1.5"/><text x="57" y="181" fill="#c9a157" font-family="DejaVu Sans" font-size="24" font-weight="700">01</text><text x="57" y="224" fill="#fff" font-family="DejaVu Sans" font-size="18" font-weight="700">CHELSEA</text><text x="57" y="261" fill="#fff" font-family="DejaVu Sans" font-size="17" font-weight="700">Conteúdo do torcedor</text><text x="57" y="302" fill="#d5d9df" font-family="DejaVu Sans" font-size="14">do convite ao telão</text><text x="57" y="327" fill="#d5d9df" font-family="DejaVu Sans" font-size="14">sem exigir cópia digital</text><text x="57" y="402" fill="#c9a157" font-family="DejaVu Sans" font-size="12" font-weight="700">Aprendi: dar destino ao registro.</text><rect x="351" y="139" width="294" height="298" rx="12" fill="#fff" stroke="#d9dfe5" stroke-width="1.5"/><text x="373" y="181" fill="#c9a157" font-family="DejaVu Sans" font-size="24" font-weight="700">02</text><text x="373" y="224" fill="#1c1e21" font-family="DejaVu Sans" font-size="18" font-weight="700">NEWCASTLE</text><text x="373" y="261" fill="#1c1e21" font-family="DejaVu Sans" font-size="17" font-weight="700">Mosaico e memória</text><text x="373" y="302" fill="#687584" font-family="DejaVu Sans" font-size="14">forte expressão visual</text><text x="373" y="327" fill="#687584" font-family="DejaVu Sans" font-size="14">alta dependência de contexto</text><text x="373" y="402" fill="#806126" font-family="DejaVu Sans" font-size="12" font-weight="700">Pergunta: funciona aqui?</text><rect x="667" y="139" width="294" height="298" rx="12" fill="#fff" stroke="#d9dfe5" stroke-width="1.5"/><text x="689" y="181" fill="#c9a157" font-family="DejaVu Sans" font-size="24" font-weight="700">03</text><text x="689" y="224" fill="#1c1e21" font-family="DejaVu Sans" font-size="18" font-weight="700">SEATTLE</text><text x="689" y="261" fill="#1c1e21" font-family="DejaVu Sans" font-size="17" font-weight="700">Ritual de chegada</text><text x="689" y="302" fill="#687584" font-family="DejaVu Sans" font-size="14">o matchday começa</text><text x="689" y="327" fill="#687584" font-family="DejaVu Sans" font-size="14">antes da bola rolar</text><text x="689" y="402" fill="#806126" font-family="DejaVu Sans" font-size="12" font-weight="700">Aprendi: pensar a jornada.</text><rect x="983" y="139" width="294" height="298" rx="12" fill="#fff" stroke="#d9dfe5" stroke-width="1.5"/><text x="1005" y="181" fill="#c9a157" font-family="DejaVu Sans" font-size="24" font-weight="700">04</text><text x="1005" y="224" fill="#1c1e21" font-family="DejaVu Sans" font-size="18" font-weight="700">MINNESOTA</text><text x="1005" y="261" fill="#1c1e21" font-family="DejaVu Sans" font-size="17" font-weight="700">Gesto coletivo</text><text x="1005" y="302" fill="#687584" font-family="DejaVu Sans" font-size="14">repetição e participação</text><text x="1005" y="327" fill="#687584" font-family="DejaVu Sans" font-size="14">produzem identidade</text><text x="1005" y="402" fill="#806126" font-family="DejaVu Sans" font-size="12" font-weight="700">Aprendi: simplificar o gesto.</text><rect x="35" y="458" width="1214" height="42" rx="8" fill="#f2e6d0" stroke="#f2e6d0" stroke-width="1.5"/><text x="52" y="486" fill="#5b4523" font-family="DejaVu Sans" font-size="14" font-weight="700">Referências externas não são pilotos do Botafogo nem evidência de viabilidade local. Fontes e limites em docs.</text></svg>