<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="485" viewBox="0 0 1280 485"><rect width="1280" height="485" fill="#f6f7f8" rx="22"/><text x="45" y="58" fill="#24292f" font-family="DejaVu Sans" font-size="26" font-weight="700">UMA IDENTIDADE HISTÓRICA. UM GESTO DE PERTENCIMENTO.</text><text x="45" y="90" fill="#687584" font-family="DejaVu Sans" font-size="16">A estrela representa o clube; os retratos mostram as pessoas que fazem parte de sua história.</text><rect x="40" y="135" width="280" height="265" rx="14" fill="#fff" stroke="#d9dfe5" stroke-width="1.5"/><text x="59" y="173" fill="#c9a157" font-family="DejaVu Sans" font-size="24" font-weight="700">01</text><polygon points="270.0,160.0 275.3,174.7 290.9,175.2 278.6,184.8 282.9,199.8 270.0,191.0 257.1,199.8 261.4,184.8 249.1,175.2 264.7,174.7" fill="#c9a157" stroke="#1c1e21" stroke-width="3" stroke-linejoin="round"/><text x="59" y="233" fill="#1c1e21" font-family="DejaVu Sans" font-size="19" font-weight="700">SÍMBOLO</text><text x="59" y="281" fill="#4e5964" font-family="DejaVu Sans" font-size="15">Estrela Solitária</text><text x="59" y="312" fill="#4e5964" font-family="DejaVu Sans" font-size="15">identidade alvinegra</text><path d="M321 259 H349" stroke="#c9a157" stroke-width="4" fill="none"/><path d="M339 251 L349 259 L339 267" fill="none" stroke="#c9a157" stroke-width="4"/><rect x="353" y="135" width="280" height="265" rx="14" fill="#f2e6d0" stroke="#d9dfe5" stroke-width="1.5"/><text x="372" y="173" fill="#c9a157" font-family="DejaVu Sans" font-size="24" font-weight="700">02</text><text x="372" y="233" fill="#1c1e21" font-family="DejaVu Sans" font-size="19" font-weight="700">PESSOAS</text><text x="372" y="281" fill="#4e5964" font-family="DejaVu Sans" font-size="15">Torcida, famílias</text><text x="372" y="312" fill="#4e5964" font-family="DejaVu Sans" font-size="15">e bastidores</text><path d="M634 259 H662" stroke="#c9a157" stroke-width="4" fill="none"/><path d="M652 251 L662 259 L652 267" fill="none" stroke="#c9a157" stroke-width="4"/><rect x="666" y="135" width="280" height="265" rx="14" fill="#fff" stroke="#d9dfe5" stroke-width="1.5"/><text x="685" y="173" fill="#c9a157" font-family="DejaVu Sans" font-size="24" font-weight="700">03</text><text x="685" y="233" fill="#1c1e21" font-family="DejaVu Sans" font-size="19" font-weight="700">GESTO</text><text x="685" y="281" fill="#4e5964" font-family="DejaVu Sans" font-size="15">Uma foto guardada</text><text x="685" y="312" fill="#4e5964" font-family="DejaVu Sans" font-size="15">outra na estrela</text><path d="M947 259 H975" stroke="#c9a157" stroke-width="4" fill="none"/><path d="M965 251 L975 259 L965 267" fill="none" stroke="#c9a157" stroke-width="4"/><rect x="979" y="135" width="280" height="265" rx="14" fill="#1c1e21" stroke="#c9a157" stroke-width="1.5"/><text x="998" y="173" fill="#c9a157" font-family="DejaVu Sans" font-size="24" font-weight="700">04</text><text x="998" y="233" fill="#fff" font-family="DejaVu Sans" font-size="19" font-weight="700">MEMÓRIA</text><text x="998" y="281" fill="#e8e9eb" font-family="DejaVu Sans" font-size="15">Lembrança pessoal</text><text x="998" y="312" fill="#e8e9eb" font-family="DejaVu Sans" font-size="15">obra coletiva</text><rect x="40" y="425" width="1198" height="39" rx="6" fill="#e9dcc3" stroke="#e9dcc3" stroke-width="1.5"/><text x="59" y="451" fill="#5b4523" font-family="DejaVu Sans" font-size="13" font-weight="700">A frase “Solitária, mas nunca sozinha” é uma interpretação criativa da proposta, não um lema histórico do clube.</text></svg>