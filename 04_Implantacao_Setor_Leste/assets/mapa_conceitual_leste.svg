 <text x="995" y="344" text-anchor="middle" fill="#374151" font-size="14" font-family="Arial,sans-serif">2 apoios · colagem</text>
 <text x="48" y="406" fill="#4b5563" font-size="16" font-family="Arial,sans-serif">Hipótese histórica: fotógrafos a 15–25 m da estrela. Percursos e faixas livres NÃO medidos.</text>
 <text x="48" y="435" fill="#4b5563" font-size="15" font-family="Arial,sans-serif">Separar área de encontro, circulação principal e ponto de colagem conforme aprovação de Operações.</text>
