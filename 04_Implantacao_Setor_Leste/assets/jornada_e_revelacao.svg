<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" role="img" aria-label="Linha do tempo ilustrativa para caminhada de 20 metros e revelação Instax">
 <rect width="1160" height="420" rx="18" fill="#f6f7f9"/>
 <text x="55" y="54" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="700">Fotografia e revelação ocorrem em paralelo</text>
 <text x="55" y="83" fill="#6b7280" font-family="Arial,sans-serif" font-size="15">Exemplo ilustrativo: foto 2 ejetada em t=0; orientação 15 s; percurso 20 m a 0,8 m/s = 25 s; interação 20 s</text>
 <g font-family="Arial,sans-serif" font-size="15" fill="#4b5563">
  <text x="80" y="134" text-anchor="middle">0 s</text><text x="245" y="134" text-anchor="middle">15 s</text><text x="518" y="134" text-anchor="middle">40 s</text><text x="736" y="134" text-anchor="middle">60 s</text><text x="1050" y="134" text-anchor="middle">90 s ≈</text>
 </g>
 <rect x="55" y="162" width="190" height="93" rx="8" fill="#dde2e8"/>
 <rect x="245" y="162" width="273" height="93" rx="8" fill="#cbd5e1"/>
 <rect x="518" y="162" width="218" height="93" rx="8" fill="#e7d3a3"/>
 <rect x="736" y="162" width="314" height="93" rx="8" fill="#faf0dc" stroke="#d5b76e" stroke-dasharray="5 5"/>
 <text x="150" y="199" fill="#111827" font-size="17" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">Receber</text>
 <text x="150" y="224" fill="#334155" font-size="14" font-family="Arial,sans-serif" text-anchor="middle">15 s (hipótese)</text>
 <text x="381" y="199" fill="#111827" font-size="17" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">Caminhar</text>
 <text x="381" y="224" fill="#334155" font-size="14" font-family="Arial,sans-serif" text-anchor="middle">25 s (hipótese)</text>
 <text x="627" y="199" fill="#111827" font-size="17" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">Observar</text>
 <text x="627" y="224" fill="#334155" font-size="14" font-family="Arial,sans-serif" text-anchor="middle">20 s (hipótese)</text>
 <text x="893" y="199" fill="#111827" font-size="17" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">~30 s residuais</text>
 <text x="893" y="224" fill="#334155" font-size="14" font-family="Arial,sans-serif" text-anchor="middle">sem espera obrigatória</text>
 <rect x="55" y="280" width="995" height="30" rx="7" fill="#b0bac8"/>
 <text x="552" y="300" fill="#111827" font-size="16" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">Desenvolvimento progressivo da foto durante aproximadamente 90 s (varia com temperatura)</text>
 <text x="55" y="360" fill="#4b5563" font-size="16" font-family="Arial,sans-serif">O marco de ~90 s é referencial do fabricante. A imagem aparece gradualmente; não aumentar a distância para ocupar o tempo.</text>
 <text x="55" y="385" fill="#4b5563" font-size="15" font-family="Arial,sans-serif">As duas fotos têm tempos de ejeção próprios; o exemplo usa a segunda como referência para não superestimar o desenvolvimento.</text>
</svg>
