<rect x="745" y="154" width="10" height="326" rx="5" fill="#a88542"/>
<text x="782" y="205" class="n">BASTIDORES · ACESSO CONTROLADO</text>
<text x="782" y="263" style="font-size:48px;font-weight:800">Até 25 grupos</text>
<text x="782" y="309" class="body">Comunicação + Futebol</text>
<text x="782" y="341" class="body">Fotos do elenco, comissão, equipe</text>
<text x="782" y="373" class="body">e mascotes, se autorizadas</text>
<rect x="782" y="412" width="547" height="40" rx="7" fill="#e0c894"/><text x="1055" y="439" text-anchor="middle" style="font-size:18px;font-weight:700">Até 50 exposições previstas</text>
