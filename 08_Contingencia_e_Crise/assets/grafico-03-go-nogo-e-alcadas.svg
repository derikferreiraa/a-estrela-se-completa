<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="490" viewBox="0 0 1240 490">
<rect width="1240" height="490" rx="20" fill="#f6f7f8"/><text x="43" y="56" font-size="27" font-family="DejaVu Sans" font-weight="700" fill="#16191d">A DECISÃO TEM DONO. A SEGURANÇA TEM VETO.</text>
<text x="43" y="89" font-size="16" font-family="DejaVu Sans" fill="#626b78">Governança proposta para o cenário B — a SAF não concedeu aprovações neste estudo</text>
<rect x="42" y="116" width="410" height="108" rx="12" fill="#17191b"/><text x="64" y="151" fill="#c9a052" font-size="18" font-family="DejaVu Sans" font-weight="700">BRANDING E EVENTOS</text><text x="64" y="182" fill="#fff" font-size="16" font-family="DejaVu Sans">Recebe falha, compara opções</text><text x="64" y="204" fill="#fff" font-size="16" font-family="DejaVu Sans">e propõe a alternativa</text>
<path d="M460 166 H 568" stroke="#c9a052" stroke-width="4"/><path d="M559 158 L 573 166 L 559 174" fill="none" stroke="#c9a052" stroke-width="4"/>
<rect x="580" y="116" width="617" height="108" rx="12" fill="#eee3d2" stroke="#c9a052"/><text x="605" y="151" fill="#6e511d" font-size="18" font-family="DejaVu Sans" font-weight="700">OPERAÇÕES / SEGURANÇA</text><text x="605" y="182" fill="#33383f" font-size="16" font-family="DejaVu Sans">Analisa implantação, circulação e acesso</text><text x="605" y="204" fill="#33383f" font-size="16" font-family="DejaVu Sans" font-weight="700">Pode aprovar ou vetar a abertura</text>
<rect x="42" y="267" width="372" height="96" rx="10" fill="#fff" stroke="#d2d9df"/><text x="64" y="303" font-size="17" font-family="DejaVu Sans" font-weight="700" fill="#a37a31">FUTEBOL</text><text x="64" y="333" font-size="14" font-family="DejaVu Sans" fill="#555f6c">Preserva elenco e desembarque</text><rect x="441" y="267" width="372" height="96" rx="10" fill="#fff" stroke="#d2d9df"/><text x="463" y="303" font-size="17" font-family="DejaVu Sans" font-weight="700" fill="#a37a31">COMUNICAÇÃO</text><text x="463" y="333" font-size="14" font-family="DejaVu Sans" fill="#555f6c">Atualiza sinalização e telão</text><rect x="840" y="267" width="372" height="96" rx="10" fill="#fff" stroke="#d2d9df"/><text x="862" y="303" font-size="17" font-family="DejaVu Sans" font-weight="700" fill="#a37a31">COMERCIAL / JURÍDICO</text><text x="862" y="333" font-size="14" font-family="DejaVu Sans" fill="#555f6c">Fornecimento, contrato e direitos</text><rect x="42" y="396" width="1154" height="68" rx="8" fill="#17191b"/><text x="62" y="422" font-size="17" font-family="DejaVu Sans" font-weight="700" fill="#d8b46b">GO SOMENTE COM TODAS AS CONDIÇÕES CRÍTICAS ATENDIDAS</text><text x="62" y="446" font-size="15" font-family="DejaVu Sans" fill="#fff">Se nenhuma alternativa for autorizada e segura, não abrir a colagem.</text></svg>