<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440">
<rect width="1240" height="440" fill="#f6f7f8" rx="20"/>
<text x="42" y="56" font-size="28" font-family="DejaVu Sans" font-weight="700" fill="#16191d">TRÊS PLANOS. O MESMO CRITÉRIO DE ABERTURA.</text>
<text x="42" y="90" font-size="16" font-family="DejaVu Sans" fill="#666e7a">Alternativas sujeitas a teste, autorização do espaço e liberação final de Operações</text>
<rect x="43" y="122" width="372" height="238" rx="12" fill="#1a1c1f" stroke="#1a1c1f"/><rect x="43" y="122" width="372" height="7" rx="3" fill="#c9a052"/><text x="66" y="169" font-size="20" font-family="DejaVu Sans" font-weight="700" fill="#c9a052">PLANO A</text><text x="66" y="204" font-size="21" font-family="DejaVu Sans" font-weight="700" fill="#ffffff">ESTRELA EM ACRÍLICO</text><text x="66" y="245" dy="0" font-size="16" font-family="DejaVu Sans" fill="#c4cad2">• Estrutura principal entregue</text><text x="66" y="245" dy="29" font-size="16" font-family="DejaVu Sans" fill="#c4cad2">• Montagem, base e fixação testadas</text><text x="66" y="245" dy="58" font-size="16" font-family="DejaVu Sans" fill="#c4cad2">• Ponto de instalação aprovado</text><rect x="442" y="122" width="372" height="238" rx="12" fill="#ffffff" stroke="#d5dbe1"/><rect x="442" y="122" width="372" height="7" rx="3" fill="#c9a052"/><text x="465" y="169" font-size="20" font-family="DejaVu Sans" font-weight="700" fill="#c9a052">PLANO B</text><text x="465" y="204" font-size="21" font-family="DejaVu Sans" font-weight="700" fill="#17191d">PAREDE LIBERADA</text><text x="465" y="245" dy="0" font-size="16" font-family="DejaVu Sans" fill="#59616e">• Parede identificada e autorizada</text><text x="465" y="245" dy="29" font-size="16" font-family="DejaVu Sans" fill="#59616e">• Contorno e adesivo removíveis</text><text x="465" y="245" dy="58" font-size="16" font-family="DejaVu Sans" fill="#59616e">• Teste de retirada sem dano</text><rect x="841" y="122" width="372" height="238" rx="12" fill="#ffffff" stroke="#d5dbe1"/><rect x="841" y="122" width="372" height="7" rx="3" fill="#c9a052"/><text x="864" y="169" font-size="20" font-family="DejaVu Sans" font-weight="700" fill="#c9a052">PLANO C</text><text x="864" y="204" font-size="21" font-family="DejaVu Sans" font-weight="700" fill="#17191d">PAREDE PROTEGIDA</text><text x="864" y="245" dy="0" font-size="16" font-family="DejaVu Sans" fill="#59616e">• Película sacrificial aprovada</text><text x="864" y="245" dy="29" font-size="16" font-family="DejaVu Sans" fill="#59616e">• Teste de aderência e remoção</text><text x="864" y="245" dy="58" font-size="16" font-family="DejaVu Sans" fill="#59616e">• Colagem apenas sobre proteção</text><rect x="42" y="383" width="1154" height="38" rx="7" fill="#eee4d2"/><text x="60" y="408" font-size="17" font-family="DejaVu Sans" font-weight="700" fill="#4c3d22">SEM SUPORTE SEGURO E LIBERADO → NÃO ABRIR A COLAGEM.</text></svg>