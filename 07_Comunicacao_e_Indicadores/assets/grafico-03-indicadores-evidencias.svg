<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="476" viewBox="0 0 1280 476"><rect width="1280" height="476" rx="24" fill="#f6f7f8"/><text x="44" y="59" fill="#17202a" font-family="DejaVu Sans" font-size="27" font-weight="700" >CADA INDICADOR RESPONDE A UMA PERGUNTA DIFERENTE.</text><text x="44" y="90" fill="#677484" font-family="DejaVu Sans" font-size="16"  >Não confundir fotografias e participações com alcance digital — resultados começam sem preenchimento.</text><rect x="43" y="135" width="226" height="257" rx="14" fill="#1a1c1e" stroke="#dbe0e5" stroke-width="1.3"/><text x="62" y="194" fill="#ddb868" font-family="DejaVu Sans" font-size="44" font-weight="700" >100</text><text x="62" y="228" fill="#fff" font-family="DejaVu Sans" font-size="14" font-weight="700" >GRUPOS · META</text><text x="62" y="280" fill="#e5e7ea" font-family="DejaVu Sans" font-size="14"  >Meta de atendimento</text><text x="62" y="306" fill="#e5e7ea" font-family="DejaVu Sans" font-size="14"  >da torcida, não</text><text x="62" y="332" fill="#e5e7ea" font-family="DejaVu Sans" font-size="14"  >resultado realizado</text><rect x="291" y="135" width="226" height="257" rx="14" fill="#fff" stroke="#dbe0e5" stroke-width="1.3"/><text x="310" y="194" fill="#c2a15d" font-family="DejaVu Sans" font-size="44" font-weight="700" >—</text><text x="310" y="228" fill="#1c2128" font-family="DejaVu Sans" font-size="14" font-weight="700" >COLAGENS</text><text x="310" y="280" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >Fotos realmente</text><text x="310" y="306" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >afixadas na estrela</text><text x="310" y="332" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >com contagem própria</text><rect x="539" y="135" width="226" height="257" rx="14" fill="#fff" stroke="#dbe0e5" stroke-width="1.3"/><text x="558" y="194" fill="#c2a15d" font-family="DejaVu Sans" font-size="44" font-weight="700" >—</text><text x="558" y="228" fill="#1c2128" font-family="DejaVu Sans" font-size="14" font-weight="700" >TELÃO</text><text x="558" y="280" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >Exibição confirmada</text><text x="558" y="306" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >+ evidência técnica</text><text x="558" y="332" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >ou acionamento reserva</text><rect x="787" y="135" width="226" height="257" rx="14" fill="#fff" stroke="#dbe0e5" stroke-width="1.3"/><text x="806" y="194" fill="#c2a15d" font-family="DejaVu Sans" font-size="44" font-weight="700" >—</text><text x="806" y="228" fill="#1c2128" font-family="DejaVu Sans" font-size="14" font-weight="700" >RELATOS</text><text x="806" y="280" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >Envios voluntários</text><text x="806" y="306" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >+ retornos possíveis</text><text x="806" y="332" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >sem obrigação de adesão</text><rect x="1035" y="135" width="226" height="257" rx="14" fill="#fff" stroke="#dbe0e5" stroke-width="1.3"/><text x="1054" y="194" fill="#c2a15d" font-family="DejaVu Sans" font-size="44" font-weight="700" >—</text><text x="1054" y="228" fill="#1c2128" font-family="DejaVu Sans" font-size="14" font-weight="700" >INSTAGRAM</text><text x="1054" y="280" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >Visualizações e</text><text x="1054" y="306" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >interações por peça</text><text x="1054" y="332" fill="#5d6874" font-family="DejaVu Sans" font-size="14"  >com período definido</text><text x="44" y="438" fill="#566373" font-family="DejaVu Sans" font-size="15"  >Até 25 grupos dos bastidores: registrar separadamente; não somar à meta de 100 grupos da torcida.</text></svg>