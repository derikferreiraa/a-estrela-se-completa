<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520"><rect width="1280" height="520" rx="24" fill="#f6f7f8"/><text x="44" y="57" fill="#17202a" font-family="DejaVu Sans" font-size="27" font-weight="700" >O VÍDEO DO INTERVALO PRECISA ESTAR PRONTO ANTES DO INTERVALO.</text><text x="44" y="88" fill="#677484" font-family="DejaVu Sans" font-size="16"  >Produção integrada: captação, montagem, aprovação, entrega técnica e confirmação de exibição.</text><rect x="42" y="130" width="223" height="227" rx="14" fill="#fff" stroke="#d2dbe3" stroke-width="1.3"/><rect x="58" y="148" width="49" height="38" rx="8" fill="#f1e3c4" stroke="#f1e3c4" stroke-width="1.3"/><text x="82" y="174" fill="#80612b" font-family="DejaVu Sans" font-size="17" font-weight="700" text-anchor="middle">01</text><text x="59" y="218" fill="#1b1d20" font-family="DejaVu Sans" font-size="19" font-weight="700" >CAPTAR</text><text x="59" y="255" fill="#586575" font-family="DejaVu Sans" font-size="14"  >Câmera estável</text><text x="59" y="280" fill="#586575" font-family="DejaVu Sans" font-size="14"  >voltada para a</text><text x="59" y="305" fill="#586575" font-family="DejaVu Sans" font-size="14"  >colagem</text><path d="M266 244 H286" fill="none" stroke="#c3a057" stroke-width="4"/><path d="M274 236 L286 244 L274 252" stroke="#c3a057" stroke-width="4" fill="none"/><rect x="289" y="130" width="223" height="227" rx="14" fill="#fff" stroke="#d2dbe3" stroke-width="1.3"/><rect x="305" y="148" width="49" height="38" rx="8" fill="#f1e3c4" stroke="#f1e3c4" stroke-width="1.3"/><text x="329" y="174" fill="#80612b" font-family="DejaVu Sans" font-size="17" font-weight="700" text-anchor="middle">02</text><text x="306" y="218" fill="#1b1d20" font-family="DejaVu Sans" font-size="19" font-weight="700" >ORGANIZAR</text><text x="306" y="255" fill="#586575" font-family="DejaVu Sans" font-size="14"  >Selecionar quadros</text><text x="306" y="280" fill="#586575" font-family="DejaVu Sans" font-size="14"  >e sequência de</text><text x="306" y="305" fill="#586575" font-family="DejaVu Sans" font-size="14"  >colagens</text><path d="M513 244 H533" fill="none" stroke="#c3a057" stroke-width="4"/><path d="M521 236 L533 244 L521 252" stroke="#c3a057" stroke-width="4" fill="none"/><rect x="536" y="130" width="223" height="227" rx="14" fill="#fff" stroke="#d2dbe3" stroke-width="1.3"/><rect x="552" y="148" width="49" height="38" rx="8" fill="#f1e3c4" stroke="#f1e3c4" stroke-width="1.3"/><text x="576" y="174" fill="#80612b" font-family="DejaVu Sans" font-size="17" font-weight="700" text-anchor="middle">03</text><text x="553" y="218" fill="#1b1d20" font-family="DejaVu Sans" font-size="19" font-weight="700" >EDITAR</text><text x="553" y="255" fill="#586575" font-family="DejaVu Sans" font-size="14"  >Montar animação</text><text x="553" y="280" fill="#586575" font-family="DejaVu Sans" font-size="14"  >e exportar peça</text><text x="553" y="305" fill="#586575" font-family="DejaVu Sans" font-size="14"  >nos parâmetros</text><path d="M760 244 H780" fill="none" stroke="#c3a057" stroke-width="4"/><path d="M768 236 L780 244 L768 252" stroke="#c3a057" stroke-width="4" fill="none"/><rect x="783" y="130" width="223" height="227" rx="14" fill="#fff" stroke="#d2dbe3" stroke-width="1.3"/><rect x="799" y="148" width="49" height="38" rx="8" fill="#f1e3c4" stroke="#f1e3c4" stroke-width="1.3"/><text x="823" y="174" fill="#80612b" font-family="DejaVu Sans" font-size="17" font-weight="700" text-anchor="middle">04</text><text x="800" y="218" fill="#1b1d20" font-family="DejaVu Sans" font-size="19" font-weight="700" >APROVAR</text><text x="800" y="255" fill="#586575" font-family="DejaVu Sans" font-size="14"  >Comunicação +</text><text x="800" y="280" fill="#586575" font-family="DejaVu Sans" font-size="14"  >operação do telão</text><text x="800" y="305" fill="#586575" font-family="DejaVu Sans" font-size="14"  >validam conteúdo</text><path d="M1007 244 H1027" fill="none" stroke="#c3a057" stroke-width="4"/><path d="M1015 236 L1027 244 L1015 252" stroke="#c3a057" stroke-width="4" fill="none"/><rect x="1030" y="130" width="223" height="227" rx="14" fill="#1b1d20" stroke="#1b1d20" stroke-width="1.3"/><rect x="1046" y="148" width="49" height="38" rx="8" fill="#f1e3c4" stroke="#f1e3c4" stroke-width="1.3"/><text x="1070" y="174" fill="#80612b" font-family="DejaVu Sans" font-size="17" font-weight="700" text-anchor="middle">05</text><text x="1047" y="218" fill="#f7f8fa" font-family="DejaVu Sans" font-size="19" font-weight="700" >EXIBIR</text><text x="1047" y="255" fill="#d6dae2" font-family="DejaVu Sans" font-size="14"  >Arquivo aceito,</text><text x="1047" y="280" fill="#d6dae2" font-family="DejaVu Sans" font-size="14"  >reproduzido e</text><text x="1047" y="305" fill="#d6dae2" font-family="DejaVu Sans" font-size="14"  >confirmado</text><rect x="42" y="384" width="1195" height="101" rx="12" fill="#f1e4c9" stroke="#d8bf8d" stroke-width="1.3"/><text x="62" y="419" fill="#6d4d15" font-family="DejaVu Sans" font-size="19" font-weight="700" >PLANO DE RESERVA</text><text x="62" y="448" fill="#473c2d" font-family="DejaVu Sans" font-size="16"  >Se o corte de edição ou a aprovação falharem, usar o vídeo-reserva previamente aprovado.</text><text x="62" y="469" fill="#6e6251" font-family="DejaVu Sans" font-size="13"  >O horário-limite, o formato do arquivo e a passagem ao telão dependem de ensaio com Comunicação/Operações.</text></svg>